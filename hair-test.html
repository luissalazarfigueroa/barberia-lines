<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        .hair-section {
            width: 100%;
            height: 100vh;
            background-color: #f7f7f7; /* Skin/Background color */
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hair-texture {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        /* Some background text just to show the background */
        .bg-text {
            font-size: 5rem;
            color: #ccc;
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="hair-section" id="hairSection">
        <div class="bg-text">Piel Limpia</div>

        <svg class="hair-texture" id="hairSvg" preserveAspectRatio="none">
            <defs>
                <!-- Hair pattern -->
                <pattern id="hairPattern" patternUnits="userSpaceOnUse" width="100" height="100">
                    <rect width="100" height="100" fill="#2c2c2c" />
                    <!-- some noise/lines for hair -->
                    <path d="M10,0 L15,100 M30,0 L25,100 M50,0 L55,100 M70,0 L65,100 M90,0 L95,100" stroke="#111" stroke-width="2" />
                </pattern>

                <mask id="cutMask">
                    <!-- Everything is white initially (visible) -->
                    <rect width="100%" height="100%" fill="white" />
                    <!-- We will draw black paths here to hide the hair -->
                    <path id="cutPath" fill="none" stroke="black" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" d="" />
                </mask>
            </defs>

            <rect width="100%" height="100%" fill="url(#hairPattern)" mask="url(#cutMask)" />
        </svg>
    </div>

    <script>
        const svg = document.getElementById('hairSvg');
        const cutPath = document.getElementById('cutPath');
        let isDrawing = false;
        let pathData = '';

        function getCoordinates(e) {
            const rect = svg.getBoundingClientRect();
            // Need to account for potential scaling, but for 100% w/h it matches
            let x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            let y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            return { x, y };
        }

        function startDrawing(e) {
            isDrawing = true;
            const { x, y } = getCoordinates(e);
            pathData += `M ${x} ${y} `;
            cutPath.setAttribute('d', pathData);
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const { x, y } = getCoordinates(e);
            pathData += `L ${x} ${y} `;
            cutPath.setAttribute('d', pathData);
        }

        function stopDrawing() {
            isDrawing = false;
        }

        svg.addEventListener('mousedown', startDrawing);
        svg.addEventListener('mousemove', draw);
        svg.addEventListener('mouseup', stopDrawing);
        svg.addEventListener('mouseleave', stopDrawing);

        svg.addEventListener('touchstart', startDrawing);
        svg.addEventListener('touchmove', draw, { passive: false });
        svg.addEventListener('touchend', stopDrawing);
    </script>
</body>
</html>
